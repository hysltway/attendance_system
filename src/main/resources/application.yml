spring:
  datasource:
    url: jdbc:mysql://localhost:3306/springboot_attendance_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池最大连接数
      maximum-pool-size: 20
      # 最小空闲连接数
      minimum-idle: 5
      # 连接超时时间
      connection-timeout: 30000
      # 空闲连接超时时间
      idle-timeout: 600000
      # 连接最大生存时间
      max-lifetime: 1800000
  jpa:
    hibernate:
      # 自动更新数据库表结构
      ddl-auto: update
    # 显示SQL语句
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      # 序列化时忽略为null的属性
      fail-on-empty-beans: false

server:
  # 服务端口
  port: 8080
  servlet:
    # 应用上下文路径
    context-path: /
  tomcat:
    # 最大线程数
    max-threads: 200
    # 最大连接数
    max-connections: 10000
    # 连接超时时间（毫秒）
    connection-timeout: 5000

# 日志配置
logging:
  level:
    # 项目包日志级别
    com.example.demo: info
    # SQL日志级别
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
  file:
    # 日志文件路径
    path: ./logs
    # 日志文件名
    name: attendance-system.log
  pattern:
    # 控制台日志格式
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    # 文件日志格式
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 自定义应用配置
app:
  # 考勤相关配置
  attendance:
    # 默认工作时间（小时）
    work-hours: 8
    # 考勤异常检查的提前天数
    check-days-ahead: 7
  # 文件上传配置
  upload:
    # 文件上传路径
    path: ./uploads
    # 允许的文件类型
    allowed-types: jpg,jpeg,png,pdf
    # 最大文件大小（MB）
    max-size: 10
